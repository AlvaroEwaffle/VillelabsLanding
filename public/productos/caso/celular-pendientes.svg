<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 934" role="img" aria-label="Ilustración: celular con la lista de chats y 23 mensajes sin responder">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2175a1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2175a1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="934" fill="url(#fondo)"/>
  <circle cx="700" cy="470" r="460" fill="url(#halo)"/>
  <!-- mesa -->
  <rect y="760" width="1400" height="174" fill="#131c31"/>
  <rect y="756" width="1400" height="6" fill="#24314d"/>
  <!-- taza -->
  <g transform="translate(1040 640)">
    <rect x="0" y="0" width="120" height="120" rx="18" fill="#e9d8c4"/>
    <path d="M120 30 q46 0 46 34 q0 34 -46 34" fill="none" stroke="#e9d8c4" stroke-width="16"/>
    <rect x="12" y="10" width="96" height="16" rx="8" fill="#6b4a2e"/>
    <path d="M40 -20 q-14 -26 0 -52 M70 -20 q-14 -26 0 -52" fill="none" stroke="#5fb2dd" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- celular -->
  <g transform="translate(470 70)">
    <rect x="0" y="0" width="460" height="820" rx="58" fill="#0b1220" stroke="#334a6b" stroke-width="10"/>
    <rect x="22" y="22" width="416" height="776" rx="42" fill="#111b2e"/>
    <rect x="180" y="34" width="100" height="22" rx="11" fill="#0b1220"/>
    <!-- barra superior -->
    <text x="50" y="112" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#f1f5f9">Chats</text>
    <rect x="300" y="84" width="112" height="40" rx="20" fill="#5fb2dd"/>
    <text x="356" y="112" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">23</text>
    <!-- filas -->
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      <g transform="translate(40 150)">
        <circle cx="34" cy="38" r="30" fill="#2175a1"/><text x="34" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">CM</text>
        <text x="80" y="30" font-size="23" font-weight="600" fill="#f1f5f9">Cafetería Mirador</text>
        <text x="80" y="62" font-size="20" fill="#94a3b8">¿Despachan a Viña?</text>
        <circle cx="352" cy="40" r="17" fill="#5fb2dd"/><text x="352" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">3</text>
      </g>
      <g transform="translate(40 250)">
        <circle cx="34" cy="38" r="30" fill="#3d93c2"/><text x="34" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">P</text>
        <text x="80" y="30" font-size="23" font-weight="600" fill="#f1f5f9">Paula · Café Brisa</text>
        <text x="80" y="62" font-size="20" fill="#94a3b8">¿Cuánto sale el kilo?</text>
        <circle cx="352" cy="40" r="17" fill="#5fb2dd"/><text x="352" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">2</text>
      </g>
      <g transform="translate(40 350)">
        <circle cx="34" cy="38" r="30" fill="#1d4e72"/><text x="34" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">OC</text>
        <text x="80" y="30" font-size="23" font-weight="600" fill="#f1f5f9">Oficina Cerro</text>
        <text x="80" y="62" font-size="20" fill="#94a3b8">¿Emiten factura?</text>
        <circle cx="352" cy="40" r="17" fill="#5fb2dd"/><text x="352" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">4</text>
      </g>
      <g transform="translate(40 450)">
        <circle cx="34" cy="38" r="30" fill="#2175a1"/><text x="34" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">D</text>
        <text x="80" y="30" font-size="23" font-weight="600" fill="#f1f5f9">Diego</text>
        <text x="80" y="62" font-size="20" fill="#94a3b8">¿A qué hora abren?</text>
        <circle cx="352" cy="40" r="17" fill="#5fb2dd"/><text x="352" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">1</text>
      </g>
      <g transform="translate(40 550)">
        <circle cx="34" cy="38" r="30" fill="#3d93c2"/><text x="34" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">V</text>
        <text x="80" y="30" font-size="23" font-weight="600" fill="#f1f5f9">Valentina</text>
        <text x="80" y="62" font-size="20" fill="#94a3b8">¿Tienen en grano?</text>
        <circle cx="352" cy="40" r="17" fill="#5fb2dd"/><text x="352" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">5</text>
      </g>
      <g transform="translate(40 650)" opacity="0.6">
        <circle cx="34" cy="38" r="30" fill="#1d4e72"/><text x="34" y="47" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">+</text>
        <text x="80" y="30" font-size="23" font-weight="600" fill="#f1f5f9">8 chats más</text>
        <text x="80" y="62" font-size="20" fill="#94a3b8">Precio, despacho, horario…</text>
      </g>
    </g>
  </g>
  <!-- globo -->
  <g transform="translate(980 150)">
    <path d="M0 0 h300 a28 28 0 0 1 28 28 v120 a28 28 0 0 1 -28 28 h-230 l-40 36 v-36 h-30 a28 28 0 0 1 -28 -28 v-120 a28 28 0 0 1 28 -28z" fill="#5fb2dd"/>
    <text x="150" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="78" fill="#0f172a">23</text>
    <text x="150" y="138" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#0f172a">sin responder</text>
  </g>
</svg>
